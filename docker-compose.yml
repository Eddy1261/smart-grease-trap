services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sgt-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: .
    container_name: sgt-backend
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      DATABASE_URL: sqlite:////app/data/smart_grease_trap.db
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DASHBOARD_STATIC_DIR: /app/dashboard
      REPORTS_DIR: /app/data/reports
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
