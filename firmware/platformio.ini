; PlatformIO Project Configuration for Smart Grease Trap
; Supports both native laptop unit testing (Phase 1) and ESP32 physical target (Phase 2)

[platformio]
default_envs = native

[env:native]
platform = native
build_flags =
    -std=c++17
    -DMOCK_HARDWARE=1
    -DUNIT_TEST=1
test_build_src = yes

[env:esp32dev]
; Pinned: Arduino-ESP32 core 3.x (platform 8.x) removed ledcSetup/ledcAttachPin.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; The Arduino-ESP32 core appends -std=gnu++11 after user flags, which would
; silently override our C++17 requirement (std::clamp in adaptive_pwm.hpp).
; Unflag it so the -std=gnu++17 below is the effective standard.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DMOCK_HARDWARE=0
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    bogde/HX711 @ ^0.7.5
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; ----------------------------------------------------------------------------
; TEMPORARY documentation build. Opens the solenoid after 3 safe C_oil cycles
; from MONITORING without skimming, so the clean-water valve response can be
; filmed. Do NOT leave this flashed for normal operation.
; Usage: pio run -e esp32dev_demo -t upload
; ----------------------------------------------------------------------------
[env:esp32dev_demo]
extends = env:esp32dev
build_flags =
    -std=gnu++17
    -DMOCK_HARDWARE=0
    -DDOCUMENTATION_VALVE_DEMO=1

[env:loadtest]
extends = env:esp32dev
build_flags =
    -std=gnu++17
    -DMOCK_HARDWARE=0
    -DLOADTEST_BUILD=1
build_src_filter = +<*> -<main.cpp>
